name: Build OpenBSD

# Build EasyTier (easytier-core / easytier-cli / easytier-web with embedded Web UI)
# for OpenBSD amd64. Artifacts are uploaded on the Actions page.
#
# This repo carries OpenBSD support in-tree:
#   - patches/guarden/                  guarden 0.2.0 (cfg_select needs rustc>=1.95)
#   - patches/boringtun-easytier/       boringtun 0.6.1 (CLOCK_BOOTTIME is Linux-only)
#   - patches/rust-tun/                 EasyTier/rust-tun fork + new OpenBSD TUN backend
#   - easytier/ + Cargo.toml/lock       source adaptations (committed)
#
# The web UI frontend is built on the ubuntu host (rollup has no OpenBSD native
# build; keeping node_modules out of the VM also avoids filling the VM disk),
# then easytier-web is compiled inside the OpenBSD VM with rust-embed picking
# up easytier-web/frontend/dist.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build-openbsd-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build web UI frontend (ubuntu host)
        run: |
          npm install -g pnpm@9
          (cd easytier-web/frontend-lib && pnpm install --prefer-offline)
          (cd easytier-web/frontend && pnpm install --prefer-offline)
          pnpm add -w @rollup/wasm-node@4.50.1
          # not needed on linux, keep the lockfile churn minimal on OpenBSD
          for R in node_modules/.pnpm/rollup@4.50.1*/node_modules/rollup/dist; do
            W=$(ls -d node_modules/.pnpm/@rollup+wasm-node@4.50.1*/node_modules/@rollup/wasm-node/dist)
            rm -rf "$R" && cp -r "$W" "$R"
          done
          (cd easytier-web/frontend-lib && pnpm build)
          (cd easytier-web/frontend && pnpm build)
          ls easytier-web/frontend/dist/
          # node_modules must not enter the OpenBSD VM (disk space)
          rm -rf node_modules easytier-web/frontend/node_modules easytier-web/frontend-lib/node_modules
          rm -rf ~/.local/share/pnpm ~/.npm

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Build in OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          # Match the version validated on the reference server (rust 1.94.1)
          release: "7.9"
          usesh: true
          cpu: 4
          mem: 8192
          # rust     = rustc/cargo (official OpenBSD package, ignores rust-toolchain.toml)
          # git      = cargo git dependencies
          # protobuf = protoc (prost-wkt-types build script)
          # llvm     = libclang (bindgen), LIBCLANG_PATH below
          prepare: |
            pkg_add -I rust git protobuf
            # "llvm" alone is ambiguous (separate packages per major version)
            pkg_add -I "$(pkg_info -Q llvm | grep -E "^llvm-[0-9]" | sort -t- -k2 -V | tail -1)"
          run: |
            set -ex
            # The VM root disk is tiny (~1GB): keep the cargo registry and all
            # build artifacts on the NFS-mounted workspace (runner disk).
            export CARGO_HOME="$GITHUB_WORKSPACE/.cargo-home"
            export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target"
            export RUSTC_BOOTSTRAP=1                  # guarden patch: #![feature(cfg_select)]
            # pkg_add llvm installs the newest major (llvm19/20/21...) — detect it
            export LIBCLANG_PATH="$(ls -d /usr/local/llvm*/lib | sort | tail -1)"
            echo "LIBCLANG_PATH=$LIBCLANG_PATH"
            # full LTO is slow; disable (remove these two lines to re-enable)
            export CARGO_PROFILE_RELEASE_LTO=false
            export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
            df -h || true
            # .crate archives are not needed once unpacked
            cargo fetch
            rm -rf "$CARGO_HOME/registry/cache"
            cargo build --release --ignore-rust-version -p easytier -p easytier-web --bins \
              --features easytier-web/embed --jobs "$(sysctl -n hw.ncpu)"
            strip "$CARGO_TARGET_DIR"/release/easytier-core "$CARGO_TARGET_DIR"/release/easytier-cli "$CARGO_TARGET_DIR"/release/easytier-web
            mkdir -p "$GITHUB_WORKSPACE/openbsd-amd64"
            cp "$CARGO_TARGET_DIR"/release/easytier-core "$CARGO_TARGET_DIR"/release/easytier-cli \
               "$CARGO_TARGET_DIR"/release/easytier-web "$GITHUB_WORKSPACE/openbsd-amd64/"

      - name: Show version
        run: ./openbsd-amd64/easytier-core --version || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: easytier-openbsd-amd64-${{ github.sha }}
          path: openbsd-amd64/
          if-no-files-found: error
