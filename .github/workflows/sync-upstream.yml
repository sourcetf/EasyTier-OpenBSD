name: Sync Upstream

# 每天两次从 EasyTier/EasyTier 同步代码到本仓库。
# - .github 目录不跟随上游：合并后只保留本仓库自己的两个 workflow，
#   上游新增/修改的 workflow、issue 模板等全部剔除。
# - 合并后若有实际变化：push 到 main，并通过 API 主动触发 Build OpenBSD
#   （用 GITHUB_TOKEN push 不会自动触发 workflow，所以这里显式 dispatch）。
# - 合并冲突（通常是上游改动了我们打过补丁的文件）→ 放弃合并、失败并开 issue。

on:
  schedule:
    - cron: "0 2,14 * * *" # UTC 02:00 / 14:00 = 北京时间 10:00 / 22:00
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream (excluding upstream .github)
        id: sync
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/EasyTier/EasyTier.git
          git fetch upstream main

          BEFORE_SHA=$(git rev-parse HEAD)
          BEFORE_TREE=$(git rev-parse "HEAD^{tree}")

          if ! git merge --no-edit upstream/main; then
            git merge --abort || true
            echo "changed=conflict" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # 只保留本仓库自己的 workflow，上游 .github 一概剔除
          find .github -type f \
            ! -path "./.github/workflows/build-openbsd.yml" \
            ! -path "./.github/workflows/sync-upstream.yml" \
            -delete
          find .github -type d -empty -delete
          git add -A .github
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi

          AFTER_TREE=$(git rev-parse "HEAD^{tree}")
          if [ "$BEFORE_TREE" != "$AFTER_TREE" ]; then
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            # 上游只有 .github 变化或无变化：丢弃空合并
            git reset --hard "$BEFORE_SHA"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Build OpenBSD
        if: steps.sync.outputs.changed == 'true'
        run: |
          curl -sS -f -X POST \
            -H "Authorization: token ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/workflows/build-openbsd.yml/dispatches" \
            -d '{"ref":"main"}'

      - name: Open issue on conflict
        if: failure() && steps.sync.outputs.changed == 'conflict'
        run: |
          curl -sS -f -X POST \
            -H "Authorization: token ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/issues" \
            -d '{"title":"[sync] 上游合并冲突，需要手工处理","body":"sync-upstream 定时任务合并 EasyTier/EasyTier@main 时发生冲突（大概率是上游改动了 OpenBSD 补丁覆盖的文件）。请手工合并：git fetch upstream && git merge upstream/main，解决冲突后重新提交，推上来的变更会自动触发 Build OpenBSD。"}'
